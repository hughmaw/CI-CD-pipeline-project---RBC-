name: CI - Production

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile
        working-directory: backend
        run: ./mvnw compile

      - name: Run Tests
        working-directory: backend
        run: ./mvnw test
      
      - name: Build JAR
        working-directory: backend
        run: ./mvnw package -DskipTests

      - name: Deploy
        working-directory: backend
        run: echo "Deploy step coming soon - will connect Render.com"